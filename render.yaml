services:
  - type: web
    name: gestion-bancaire
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: banking-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: banking-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: banking-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: banking-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: banking-db
          property: password
      - key: CACHE_DRIVER
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: QUEUE_CONNECTION
        value: database
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: banking-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: banking-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: keyvalue
          name: banking-redis
          property: password

  - type: keyvalue
    name: banking-db
    plan: starter
    ipAllowList: []

  - type: keyvalue
    name: banking-redis
    ipAllowList: []
    plan: starter
